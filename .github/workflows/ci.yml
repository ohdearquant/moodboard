name: CI

# Runs on every pull request and on pushes to main. The suite needs no network and no
# downloaded model weights: ClassicalEncoder computes its representation from the axes in
# axes.py, which is why the whole engine is exercisable on a bare runner.
#
# This file originally ran on pull requests only, because main did not yet contain the Python
# project and a push trigger would have painted the default branch red at `uv sync` for a
# reason that was not a defect. The same comment ordered the push trigger added in the change
# that landed the engine on main. The engine has landed; this is that trigger, so the default
# branch's green is a statement about main itself and not only about the last merged PR.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A second push to a PR makes the first run's result meaningless, so cancel it rather than
# leaving two runs whose greens refer to different code. On main the opposite holds: every
# pushed merge commit deserves its own completed run, because a cancelled run on an earlier
# merge leaves that merge unverified forever, so main runs queue instead of cancelling.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # LINT AND TESTS ARE SEPARATE JOBS, and this is not tidiness. When they shared a job the
  # linter ran first, failed, and the suite never executed at all -- so the very first CI run
  # this repository ever had reported a red that said nothing whatsoever about whether the
  # tests pass. One cheap failure masked the expensive evidence that was the whole point of
  # standing CI up. Split, each reports its own answer and neither can hide the other.
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install the pinned environment
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .

  test:
    # The job name is a promise about what it measures. This one runs the whole suite
    # uncapped, so it is named for that and not for something broader.
    name: pytest (full suite, uncapped)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >=3.11. Both ends of the supported range are
        # tested, because a floor that is never exercised is a floor nobody knows is broken.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the pinned environment
        # --locked, not --frozen: this must FAIL if uv.lock has drifted from pyproject.toml
        # rather than quietly resolving something else and testing a dependency set that is
        # not the one committed.
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Install the pinned viewer toolchain
        uses: actions/setup-node@v4
        with:
          node-version-file: viewer/.node-version
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Stage verified viewer package data
        # The Python inliner deliberately consumes only the manifest-verified package-data copy.
        # Rebuild it from the locked frontend inputs and prove that the committed static output is
        # byte-identical before the Python matrix exercises the HTML command.
        run: |
          npm --prefix viewer ci
          npm --prefix viewer run build
          git diff --exit-code -- viewer/dist-static

      - name: Tests
        # No -x and no --maxfail. A first-failure read tells you one thing is broken; a
        # release-grade read tells you how many, and the difference matters when deciding
        # whether a branch is close or far from green.
        # -rA prints the reason for every xfail, so a strict-xfail carrying a real finding
        # stays visible in the log instead of collapsing to a single character.
        run: uv run pytest -q -rA
